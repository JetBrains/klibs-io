klibs:
  indexing: false
  ai: false
  indexing-configuration:
    central-sonatype:
      enabled: true
    google-maven-central-mirror:
      enabled: false
  integration:
    github:
      personal-access-token: test
  scheduling:
    process-indexing-queue:
      enabled: false
    fill-version-type:
      enabled: false
    # Tests drive OpenSearchIndexer directly and assert exact generations; a scheduled run would race.
    search-index-sync:
      enabled: false

spring:
  sql:
    init:
      mode: always
  cloud:
    aws:
      region:
        static: eu-west-1
      credentials:
        access-key: test
        secret-key: test
      endpoint: http://localhost:4566