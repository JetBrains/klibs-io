databaseChangeLog:
  - changeSet:
      id: enable pgvector extension
      author: dmitrii.krasnov@jetbrains.com
      changes:
        - sql:
            sql: |
              CREATE EXTENSION IF NOT EXISTS vector;

  - changeSet:
      id: add readme_embedding column to project
      author: dmitrii.krasnov@jetbrains.com
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: project
              columnName: readme_embedding
      changes:
        - sql:
            sql: |
              ALTER TABLE project ADD COLUMN readme_embedding vector(1536);
      rollback:
        - sql:
            sql: |
              ALTER TABLE project DROP COLUMN readme_embedding;
