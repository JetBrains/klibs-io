        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: project
              columnName: readme_embedding_openai_ada
      changes:
        - sql:
            sql: |
              ALTER TABLE project ADD COLUMN readme_embedding_openai_ada vector(1536);
      rollback:
        - sql:
            sql: |
              ALTER TABLE project DROP COLUMN readme_embedding_openai_ada;
