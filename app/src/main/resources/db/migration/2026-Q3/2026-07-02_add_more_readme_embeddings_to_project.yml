databaseChangeLog:
  - changeSet:
      id: add readme_embedding_openai_large column to project
      author: dmitrii.krasnov@jetbrains.com
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: project
              columnName: readme_embedding_openai_large
      changes:
        - sql:
            sql: |
              ALTER TABLE project ADD COLUMN readme_embedding_openai_large vector(3072);
      rollback:
        - sql:
            sql: |
              ALTER TABLE project DROP COLUMN readme_embedding_openai_large;

  - changeSet:
      id: add readme_embedding_openai_ada column to project
      author: dmitrii.krasnov@jetbrains.com
