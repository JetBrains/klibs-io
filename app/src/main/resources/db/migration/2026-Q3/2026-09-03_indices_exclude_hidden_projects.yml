databaseChangeLog:
  - changeSet:
      id: drop project_index before recreating package_index
      author: nikita.vlaev@jetbrains.com
      comment: "KTL-2057: project_index reads package_index, so it has to go first and come back after."
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*)
              FROM pg_matviews
              WHERE schemaname = current_schema()
                AND matviewname = 'project_index'
      changes:
        - sql:
            sql: |
              DROP MATERIALIZED VIEW IF EXISTS project_index;

  - changeSet:
      id: recreate package_index excluding hidden projects
      author: nikita.vlaev@jetbrains.com
      changes:
        - sqlFile:
            path: 2026-09-03_package_index_exclude_hidden_projects.sql
            relativeToChangelogFile: true

  - changeSet:
      id: recreate package_index indexes after excluding hidden projects
      author: nikita.vlaev@jetbrains.com
      changes:
        - sql:
            sql: CREATE INDEX package_index_fts_gin_idx ON package_index USING GIN (fts)
        - sql:
            sql: CREATE INDEX package_index_platforms_vector_gin_idx ON package_index USING GIN (platforms_vector)
        - createIndex:
            indexName: package_index_unique
            tableName: package_index
            unique: true
            columns:
              - column:
                  name: group_id
              - column:
                  name: artifact_id

  - changeSet:
      id: recreate project_index after recreating package_index
      author: nikita.vlaev@jetbrains.com
      comment: "KTL-2057: unchanged definition. Hidden projects drop out through the inner join on package_index."
      changes:
        - sqlFile:
            path: 2026-09-03_recreate_project_index_after_package_index.sql
            relativeToChangelogFile: true

  - changeSet:
      id: recreate project_index indexes after recreating package_index
      author: nikita.vlaev@jetbrains.com
      changes:
        - sql:
            sql: CREATE INDEX project_index_fts_gin_idx ON project_index USING GIN (fts)
        - sql:
            sql: CREATE INDEX project_index_platforms_vector_gin_idx ON project_index USING GIN (platforms_vector)
        - sql:
            sql: CREATE INDEX project_index_markers_gin_idx ON project_index USING GIN (markers)
        - createIndex:
            indexName: project_index_stars_idx
            tableName: project_index
            columns:
              - column:
                  name: stars
        - createIndex:
            indexName: project_index_project_id_idx
            tableName: project_index
            columns:
              - column:
                  name: project_id
        - createIndex:
            indexName: project_index_unique
            tableName: project_index
            unique: true
            columns:
              - column:
                  name: project_id
