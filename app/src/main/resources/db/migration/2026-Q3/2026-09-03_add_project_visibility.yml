databaseChangeLog:
  - changeSet:
      id: add unreachable_since to scm_repo
      author: nikita.vlaev@jetbrains.com
      comment: "KTL-2057: hide projects if unreachable for too long."
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: scm_repo
              columnName: unreachable_since
      changes:
        - addColumn:
            tableName: scm_repo
            columns:
              - column:
                  name: unreachable_since
                  type: TIMESTAMP
                  remarks: "When GitHub first stopped returning this repository (private, deleted or renamed away). NULL means reachable."

  - changeSet:
      id: create project_hidden table
      author: nikita.vlaev@jetbrains.com
      comment: "KTL-2057: hide projects if unreachable for too long."
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: project_hidden
      changes:
        - createTable:
            tableName: project_hidden
            columns:
              - column:
                  name: project_id
                  type: INTEGER
                  constraints:
                    nullable: false
                    references: project(id)
                    foreignKeyName: fk_project_hidden_project_id
                    deleteCascade: true
              - column:
                  name: hidden_at
                  type: TIMESTAMP
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  name: origin
                  type: VARCHAR(16)
                  remarks: "AUTO for hides driven by an unreachable repo, MANUAL for hides made through the admin API. Only AUTO rows are removed automatically."
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(512)
                  remarks: "Free-form explanation, for operators."
        - addPrimaryKey:
            tableName: project_hidden
            columnNames: project_id
            constraintName: pk_project_hidden
