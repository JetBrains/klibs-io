product: jvm/lib

apply:
  - ../../build-logic/templates/spring-web.module-template.yaml
  - ../../build-logic/templates/persistence.module-template.yaml
  - ../../build-logic/templates/mock.module-template.yaml

dependencies:
  - ../package
  - ../scm-owner
  - $libs.opensearch.java: exported

settings:
  kotlin:
    freeCompilerArgs:
      # Needed for container-element constraints, e.g. List<@Size(max = ...) String>
      - -Xemit-jvm-type-annotations
