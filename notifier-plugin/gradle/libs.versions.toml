[versions]
junitJupiterApi = "6.1.3"
kotlin = "2.4.10"
vanniktech-maven-publish = "0.37.0"

[libraries]
gradle-maven-publish-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "vanniktech-maven-publish" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junitJupiterApi" }
